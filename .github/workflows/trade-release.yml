# Rebuilds the trade release page when a new monthly trade report (FT-900) is
# out and the Census trade store holds its month, and publishes it. Runs after
# each update of the store; a run with no new release stops after the check.
#
# Pushes to main with a deploy key, which the main ruleset lets bypass its
# pull request rule, so the push also runs publish.yml. Needs repository
# secrets RELEASE_DEPLOY_KEY (the private half of a deploy key with write
# access) and CENSUS_API_KEY.
name: Refresh trade release page

on:
  workflow_run:
    workflows: [Update Census trade data]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trade-release
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      # Libraries the ragg graphics device needs to draw charts.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libfreetype6 libpng16-16t64 libtiff6 libjpeg-turbo8 libwebp7 libwebpmux3 libharfbuzz0b libfribidi0
      - id: check
        run: Rscript scripts/check_trade_release.R
      - if: steps.check.outputs.status == 'new'
        run: Rscript charts/trade-release/build.R
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      - if: steps.check.outputs.status == 'new'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898702+github-actions[bot]@users.noreply.github.com"
          git add charts/trade-release
          git commit -m "Refresh the trade release page for ${{ steps.check.outputs.month }} data"
          git push origin main
